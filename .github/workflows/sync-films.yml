name: sync films

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - "reviews/**" # so review edits and tag changes show up right away
      - "scripts/sync_films.py"
      - "film.html" # the film preview pages are copies of it

permissions:
  contents: write

concurrency:
  group: sync-films
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull Letterboxd diary
        run: python3 scripts/sync_films.py

      # Runs even if the feed fetch failed, so hasReview changes still land.
      - name: Commit changes
        if: always()
        run: |
          git config user.name "log4n film sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reviews films
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "sync films from letterboxd"
          git pull --rebase
          git push
