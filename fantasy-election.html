<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Election - log4n</title>
<style>
  :root {
    --salmon: #FA8072;
    --salmon-dark: #e8604f;
    --salmon-light: #fdb8b0;
    --cream: #fff8f5;
    --ink: #2a1a17;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--cream); color: var(--ink);
               font-family: Verdana, Geneva, sans-serif; font-size: 13px; }
  body { display: flex; flex-direction: column; }

  .bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.35rem 1rem;
    background: #22211d;
    color: #eae5d7;
    border-bottom: 1px solid #37342c;
  }
  .brand {
    font-size: 1.15rem;
    font-weight: bold;
    color: var(--salmon-dark);
    text-decoration: none;
    line-height: 1;
  }
  .brand .four { font-size: 1.5rem; }
  .brand:hover { color: var(--salmon-light); }
  .name { font-weight: bold; }
  .note { margin-left: auto; opacity: 0.65; font-size: 0.8rem; }
  @media (max-width: 600px) { .note { display: none; } }

  iframe { flex: 1; width: 100%; border: 0; background: #22211d; }
</style>
</head>
<body>
  <div class="bar">
    <a class="brand" href="index.html#projects" title="back to log4n">log<span class="four">4</span>n</a>
    <span class="name">Fantasy Election</span>
    <!--<span class="note">first load can take ~15 seconds while it wakes up</span> -->
  </div>
  <iframe src="https://fantasy-election-624328008043.us-east1.run.app/App"
          title="Fantasy Election" allow="clipboard-write"></iframe>
</body>
</html>
