<style>
  :root {
    --salmon: #FA8072;
    --salmon-dark: #e8604f;
    --salmon-light: #fdb8b0;
    --cream: #fff8f5;
    --ink: #2a1a17;
  }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: Verdana, Geneva, sans-serif;
    font-size: 13px;
    min-height: 100vh;
  }

  a { color: var(--salmon-dark); text-decoration: underline; }
  a:hover { color: var(--ink); }

  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }

  .crumbs {
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }

  .panel {
    background: #ffffff;
    border: 1px solid var(--salmon-light);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
  }

  .panel h2 {
    font-size: 1.1rem;
    font-weight: bold;
    margin: 0 0 0.6rem;
    color: var(--salmon-dark);
    border-bottom: 1px solid var(--salmon-light);
    padding-bottom: 0.4rem;
  }

  .film-head {
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .film-head img {
    width: 160px;
    max-width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border: 1px solid var(--salmon-dark);
    box-shadow: 3px 3px 0 var(--salmon-dark);
    background: var(--salmon-light);
  }

  .film-meta { flex: 1 1 220px; min-width: 0; }

  .film-title {
    font-size: 1.6rem;
    font-weight: bold;
    margin: 0 0 0.3rem;
    color: var(--ink);
  }

  .film-title .year {
    font-weight: normal;
    font-size: 1rem;
    opacity: 0.6;
  }

  .stars { color: var(--salmon-dark); font-size: 1.1rem; letter-spacing: 0.08em; }
  .liked-heart { display: inline-block; width: 0.9em; height: 0.9em; vertical-align: -0.1em; fill: var(--salmon-dark); }
  .muted { opacity: 0.65; font-size: 0.85rem; }
  .film-meta p { margin: 0.35rem 0; }

  /* the joke letterboxd review, shown big like a poster tagline */
  .tagline {
    position: relative;
    margin: 0.5rem 0 0.9rem;
    padding: 0.15rem 0 0 2.2rem;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 1.25rem;
    line-height: 1.45;
    color: var(--ink);
  }
  .tagline::before {
    content: "\201C";
    position: absolute;
    left: 0;
    top: -0.45rem;
    font-size: 3.4rem;
    line-height: 1;
    font-style: normal;
    color: var(--salmon);
  }
  .tagline p { margin: 0 0 0.3rem; }
  .tagline p:last-of-type { margin-bottom: 0; }
  .tagline summary {
    cursor: pointer;
    font-family: Verdana, Geneva, sans-serif;
    font-style: normal;
    font-size: 0.8rem;
    opacity: 0.7;
  }

  /* cinema ticket: when / who / rating / which viewing */
  .ticket {
    position: relative;
    display: flex;
    max-width: 400px;
    margin: 0.7rem 0;
    background: #fff3ef;
    border: 1px solid var(--salmon);
  }

  .ticket-main {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, auto);
    align-items: start;
    justify-content: space-between;
    gap: 0.55rem 1rem;
    padding: 0.6rem 0.8rem;
  }

  .ticket-field.wide { grid-column: span 2; }

  .ticket-field { font-size: 0.85rem; min-width: 0; }
  .ticket-field a { color: var(--ink); }
  .ticket-field a:hover { color: var(--salmon-dark); }
  .ticket-field .stars { font-size: 0.95rem; }

  .ticket-label {
    display: block;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.55;
    margin-bottom: 0.1rem;
  }

  .ticket-stub {
    width: 2.6rem;
    flex: none;
    border-left: 2px dashed var(--salmon);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    display: flex;
    flex-direction: column; /* in vertical text, this lays the two lines side by side */
    justify-content: center;
    align-items: center;
    gap: 0.2rem;
    padding: 0.4rem 0;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--salmon-dark);
  }

  /* half-circle bites where the stub tears off */
  .ticket::before,
  .ticket::after {
    content: '';
    position: absolute;
    right: calc(2.6rem - 6px);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ffffff;
    border: 1px solid var(--salmon);
  }
  .ticket::before { top: -7px; clip-path: inset(50% 0 0 0); }
  .ticket::after { bottom: -7px; clip-path: inset(0 0 50% 0); }

  .starring { font-size: 0.8rem; margin: 0.6rem 0 0; line-height: 1.6; }
  .starring .ticket-label { display: inline; margin-right: 0.35rem; }
  .starring a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--salmon); }
  .starring a:hover { color: var(--salmon-dark); }

  /* tags + letterboxd link, quiet, at the very bottom */
  .film-foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.4rem 1rem;
    font-size: 0.72rem;
    opacity: 0.6;
    padding: 0 0.25rem;
  }
  .film-foot:hover { opacity: 0.9; }
  .film-foot a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .film-foot a:hover { color: var(--salmon-dark); }
  .film-foot a.mine { color: var(--salmon-dark); }

  .earlier {
    border-top: 1px dashed var(--salmon-light);
    margin-top: 1rem;
    padding-top: 0.6rem;
  }
  .earlier-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; }
  .earlier .watch { margin-top: 0.6rem; font-size: 0.85rem; }
  .earlier .stars { font-size: 0.9rem; }
  .earlier .tagline { margin: 0.35rem 0 0; padding-left: 1.5rem; font-size: 0.95rem; }
  .earlier .tagline::before { font-size: 2.2rem; top: -0.3rem; }

  .review {
    line-height: 1.75;
    font-size: 0.95rem;
  }
  .review h1, .review h2, .review h3 {
    color: var(--salmon-dark);
    border: none;
    padding: 0;
    margin: 1.4rem 0 0.4rem;
  }
  .review h1 { font-size: 1.3rem; }
  .review h2 { font-size: 1.1rem; }
  .review h3 { font-size: 1rem; }
  .review figure { margin: 1.2rem 0; }
  .review img {
    display: block;
    max-width: 100%;
    height: auto;
    border: 1px solid var(--salmon-dark);
    box-shadow: 3px 3px 0 var(--salmon-dark);
  }
  .review figcaption {
    font-size: 0.78rem;
    font-style: italic;
    opacity: 0.65;
    margin-top: 0.5rem;
  }
  .review blockquote {
    border-left: 3px solid var(--salmon-light);
    margin: 0.8rem 0;
    padding-left: 0.9rem;
    font-style: italic;
  }
  .review hr {
    border: none;
    text-align: center;
    margin: 1.5rem 0;
  }
  .review hr::before { content: '* * *'; letter-spacing: 0.6em; color: var(--salmon); }
  .review details {
    background: var(--cream);
    border: 1px dashed var(--salmon-light);
    padding: 0.4rem 0.8rem;
    margin: 0.8rem 0;
  }
  .review summary { cursor: pointer; color: var(--salmon-dark); font-size: 0.85rem; }
  .review ul, .review ol { padding-left: 1.4rem; }
  .review .spoiler {
    background: var(--ink);
    color: transparent;
    cursor: pointer;
    padding: 0 0.15rem;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .review .spoiler.shown { background: var(--salmon-light); color: inherit; cursor: auto; }
  .review .pair { display: flex; gap: 0.75rem; margin: 1.2rem 0; }
  .review .pair img { flex: 1; min-width: 0; object-fit: cover; }
  .review table {
    display: block;
    overflow-x: auto;
    border-collapse: collapse;
    font-size: 0.85rem;
    margin: 0.8rem 0;
  }
  .review th, .review td {
    border: 1px solid var(--salmon-light);
    padding: 0.3rem 0.6rem;
    text-align: left;
  }
  .review th { background: var(--cream); }
  .review code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.85em;
    background: var(--cream);
    border: 1px solid var(--salmon-light);
    padding: 0 0.25rem;
  }
  .review pre {
    background: var(--cream);
    border: 1px dashed var(--salmon-light);
    padding: 0.6rem 0.8rem;
    overflow-x: auto;
    line-height: 1.5;
  }
  .review pre code { border: none; padding: 0; background: none; }

  .preview-note {
    font-size: 0.75rem;
    background: var(--salmon-light);
    border: 1px solid var(--salmon);
    padding: 0.4rem 0.7rem;
    margin-bottom: 1rem;
  }

  .not-found { text-align: center; }
</style>
</head>
<body>

<main>
  <div class="crumbs"><a href="/#films">&larr; all films</a></div>
  <div id="film"><p class="muted">loading&hellip;</p></div>
</main>

<script src="/oneko.js" data-cat="/oneko.gif"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<script>
  const root = document.getElementById('film');

  // Works as /films/double-indemnity (films/<slug>.html, written by the
  // sync with link-preview tags) and as film.html?f=double-indemnity.
  function slugFromUrl() {
    const fromQuery = new URLSearchParams(location.search).get('f');
    if (fromQuery) return fromQuery;
    const match = location.pathname.match(/\/films\/([^/]+?)(?:\.html)?\/?$/);
    return match ? decodeURIComponent(match[1]) : null;
  }

  function stars(rating) {
    if (rating == null) return '';
    return '★'.repeat(Math.floor(rating)) + (rating % 1 ? '½' : '');
  }

  // Drawn instead of the ♥ character, which some fonts don't have.
  const HEART = '<svg class="liked-heart" width="14" height="14" viewBox="0 0 24 24" role="img" aria-label="liked"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2.2 4 6.3 4c2.4 0 3.9 1.3 5.7 3.4C13.8 5.3 15.3 4 17.7 4c4.1 0 6 4.4 4.3 7.7C19.5 16.4 12 21 12 21z"/></svg>';

  function formatDate(iso) {
    return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric'
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  // Cloudflare Pages answers a missing file with index.html, so a 200 alone
  // doesn't mean the review exists — check it isn't an HTML page.
  // `path` is relative to reviews/ without ".md". Returns { body, tags, genres,
  // cast } with the "---" block split off; a list missing from the file is null.
  async function fetchReview(path) {
    try {
      const res = await fetch('/reviews/' + path.split('/').map(encodeURIComponent).join('/') + '.md');
      if (!res.ok || (res.headers.get('content-type') || '').includes('text/html')) return null;
      let body = await res.text();
      const fields = { tags: null, genres: null, cast: null, quote: null };
      const front = body.match(/^---\s*\n([\s\S]*?)\n---\s*(?:\n|$)/);
      if (front) {
        body = body.slice(front[0].length);
        front[1].split('\n').forEach(line => {
          const [key, ...rest] = line.split(':');
          const name = key.trim().toLowerCase();
          if (name === 'quote') {
            fields.quote = rest.join(':').trim().toLowerCase() || null;
          } else if (name in fields) {
            const values = rest.join(':').split(',').map(t => t.trim()).filter(Boolean);
            fields[name] = name === 'cast' ? values : values.map(v => v.toLowerCase());
          }
        });
      }
      // Comments don't count, so a pre-filled file with no text isn't a review.
      return { body: body.replace(/<!--[\s\S]*?-->/g, '').trim(), ...fields };
    } catch {
      return null;
    }
  }

  // ?review=examples/double-indemnity shows another file from reviews/ in
  // place of this film's own review, for previewing drafts and examples.
  function previewPath() {
    const path = new URLSearchParams(location.search).get('review');
    return path && /^[a-z0-9_-]+(\/[a-z0-9_-]+)*$/i.test(path) ? path : null;
  }

  function tagline(w) {
    // `take` is Letterboxd's own sanitized HTML, so it goes in as-is.
    if (!w.take) return '';
    return w.spoilers
      ? '<details class="tagline"><summary>contains spoilers, click to show</summary>' + w.take + '</details>'
      : '<blockquote class="tagline">' + w.take + '</blockquote>';
  }

  function ratingLine(w) {
    return '<span class="stars">' + stars(w.rating) + '</span>' + (w.liked ? ' ' + HEART : '');
  }

  const ORDINALS = ['first', 'second', 'third', 'fourth', 'fifth'];

  function formatRuntime(minutes) {
    if (!minutes) return '?';
    const h = Math.floor(minutes / 60), m = minutes % 60;
    return (h ? h + 'h ' : '') + m + 'm';
  }

  // Which Letterboxd review is featured: the latest, unless the review file
  // says `quote: first` or `quote: <watch date>` (same rule as the sync).
  function featuredWatch(watches, quote) {
    if (quote === 'first') return watches[watches.length - 1];
    return watches.find(w => w.date === quote) || watches[0];
  }

  function ticket(film, latest, number) {
    // watches are newest first, so the oldest is viewing #1
    const nth = film.watches.length - film.watches.indexOf(latest);
    const viewing = film.watches.length > 1
      ? (ORDINALS[nth - 1] || '#' + nth)
      : (latest.rewatch ? 'rewatch' : 'first');
    const field = (label, value, wide) =>
      '<div class="ticket-field' + (wide ? ' wide' : '') + '"><span class="ticket-label">' + label + '</span>' + value + '</div>';

    return '<div class="ticket">' +
      '<div class="ticket-main">' +
        field('seen', formatDate(latest.date)) +
        field('released', film.released ? formatDate(film.released) : (film.year || '?')) +
        field('runtime', formatRuntime(film.runtime)) +
        field('directed by', film.director
          ? '<a href="' + filmsLink('dir:' + film.director) + '">' + escapeHtml(film.director) + '</a>'
          : '?') +
        field('viewing', viewing) +
        field('rating', ratingLine(latest)) +
      '</div>' +
      '<div class="ticket-stub"><span>admit one</span><span>No. ' + String(number).padStart(3, '0') + '</span></div>' +
    '</div>';
  }

  function starring(cast) {
    if (!cast.length) return '';
    return '<p class="starring"><span class="ticket-label">starring</span>' +
      cast.map(name => '<a href="' + filmsLink('cast:' + name) + '">' + escapeHtml(name) + '</a>').join(', ') +
      '</p>';
  }

  function filmsLink(filter) {
    return '/?f=' + encodeURIComponent(filter) + '#films';
  }

  function filmFoot(tagList, latest, myTags) {
    const tags = tagList.map(tag =>
      '<a' + (myTags.includes(tag) ? ' class="mine"' : '') + ' href="' + filmsLink('tag:' + tag) + '">' +
        escapeHtml(tag) + '</a>'
    ).join(' &middot; ');
    return '<div class="film-foot">' +
      '<span>' + (tags ? 'filed under ' + tags : '') + '</span>' +
      '<a href="' + escapeHtml(latest.url) + '" target="_blank">letterboxd &#8599;</a>' +
    '</div>';
  }

  // A markdown image with a title — ![alt](src "caption") — becomes a
  // captioned figure; a bare image on its own line still gets the framing.
  function figureImages(container) {
    container.querySelectorAll('p > img:only-child').forEach(img => {
      const figure = document.createElement('figure');
      img.parentElement.replaceWith(figure);
      figure.appendChild(img);
      if (img.title) {
        const caption = document.createElement('figcaption');
        caption.textContent = img.title;
        figure.appendChild(caption);
        img.removeAttribute('title');
      }
    });
  }

  function earlierWatches(watches, title) {
    if (!watches.length) return '';
    return '<div class="earlier"><div class="earlier-title">' + title + '</div>' +
      watches.map(w =>
        '<div class="watch">' + formatDate(w.date) + ' &middot; ' + ratingLine(w) +
          ' &middot; <a href="' + escapeHtml(w.url) + '" target="_blank">on letterboxd</a>' +
          tagline(w) + '</div>'
      ).join('') + '</div>';
  }

  function notFound() {
    root.innerHTML = '<div class="panel not-found"><h2>no film here</h2>' +
      '<p>couldn\'t find that one. <a href="/#films">see all films</a></p></div>';
  }

  async function main() {
    const slug = slugFromUrl();
    if (!slug) return notFound();

    let films;
    try {
      films = await (await fetch('/data/films.json')).json();
    } catch {
      root.innerHTML = '<div class="panel"><p>couldn\'t load the film list. try refreshing.</p></div>';
      return;
    }

    const film = films[slug];
    if (!film || !film.listed) return notFound();

    document.title = film.title + (film.year ? ' (' + film.year + ')' : '') + ' - log4n';

    const preview = previewPath();
    const review = await fetchReview(preview || slug);
    const quote = review && review.quote ? review.quote : film.quote;
    const latest = featuredWatch(film.watches, quote);
    const earlier = film.watches.filter(w => w !== latest);
    const othersTitle = latest === film.watches[0] ? 'earlier watches' : 'other watches';
    // films.json only updates when the sync runs, so read the lists straight
    // from the review file (same rules as the sync) so edits, drafts and
    // previews show up right away.
    const auto = film.auto || { genres: [], cast: [] };
    const genres = review && review.genres ? review.genres : (film.genres || []);
    const cast = review && review.cast ? review.cast : (film.cast || []);
    const myTags = review && review.tags ? review.tags : (film.myTags || []);
    const decade = film.year ? [Math.floor(film.year / 10) * 10 + 's'] : [];
    const tagList = [...new Set([...myTags, ...genres, ...decade])];
    const highlighted = [...myTags, ...genres.filter(g => !auto.genres.includes(g))];

    // Ticket number: this film's place in the order I first logged things.
    const firstSeen = f => f.watches[f.watches.length - 1].date;
    const number = Object.values(films).filter(f => f.listed)
      .filter(f => firstSeen(f) <= firstSeen(film)).length;

    const poster = film.poster
      ? '<img src="' + escapeHtml(film.poster) + '" alt="' + escapeHtml(film.title) + ' poster">'
      : '';

    root.innerHTML =
      (preview ? '<div class="preview-note">previewing <code>reviews/' + escapeHtml(preview) + '.md</code> in place of this film\'s review</div>' : '') +
      '<div class="panel"><div class="film-head">' + poster +
        '<div class="film-meta">' +
          '<p class="film-title">' + escapeHtml(film.title) +
            (film.year ? ' <span class="year">' + film.year + '</span>' : '') + '</p>' +
          tagline(latest) +
          ticket(film, latest, number) +
          starring(cast) +
        '</div>' +
      '</div>' + earlierWatches(earlier, othersTitle) + '</div>' +
      '<div class="panel" id="review-panel" hidden><h2>the review</h2><div class="review" id="review"></div></div>' +
      filmFoot(tagList, latest, highlighted);

    if (review && review.body && window.marked) {
      const container = document.getElementById('review');
      container.innerHTML = marked.parse(review.body);
      figureImages(container);
      // <span class="spoiler">...</span> stays blacked out until clicked.
      container.addEventListener('click', e => {
        const spoiler = e.target.closest('.spoiler');
        if (spoiler) spoiler.classList.add('shown');
      });
      document.getElementById('review-panel').hidden = false;
    }
  }

  main();
</script>

</body>
</html>
